name: Build Shario APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report Build Failure Summary
        if: failure()
        run: |
          echo "## ❌ Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "### Compiler Errors" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:|FAILED|FAILURE:" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Last 100 Log Lines" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 -c "
          with open('build.log', errors='ignore') as f:
              lines = f.readlines()
          errs = [l.strip() for l in lines if any(k in l for k in ['e: ', 'error:', 'AAPT:'])]
          if not errs:
              errs = [l.strip() for l in lines[-30:] if l.strip()]
          for l in errs[:15]:
              l_clean = l.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=CompilerError::{l_clean}')
          "

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shario-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: Shario-All-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Shario v1.2.0 — Fast Sharing. Zero Hassle."
          make_latest: true
          body: |
            ### 🚀 Shario v1.2.0 — Fast Sharing. Zero Hassle.
            
            100% Bit-for-Bit Original Phone-to-Phone File Sharing (Ad-Free & Lossless).
            
            #### 📥 Direct APK Download (Latest)
            - **[⬇️ Download app-release.apk](https://github.com/abdulraheemasangi/shario/releases/download/v1.2.0/app-release.apk)** (Production Signed)
            
            #### What's New in v1.2.0:
            - **CameraX QR Code Scanner**: Scan button now opens an integrated CameraX QR viewfinder with live beam analysis.
            - **Rich Thumbnails & App Icons**: Real-time native thumbnail loading for Photos, Videos, and Installed App icons with LRU caching.
            - **New Documents & Files Tab**: Full support for PDFs, Excels, Word Docs, PowerPoints, Text files, and ZIP archives.
            - **Clean Receiver Screen**: Technical IP addresses removed in favor of a sleek Apple-style "Waiting for Sender" status.
            - **SVGs Instead of Emojis**: Replaced text emojis with crisp Material Vector Icons / SVGs across the entire UI.
            - **Apple Liquid Glass Theme**: Translucent frosted glass cards, ambient mesh glow, and safe status bar insets.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
