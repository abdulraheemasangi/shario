name: Build Shario APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report Build Failure Summary
        if: failure()
        run: |
          echo "## ❌ Build Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "### Compiler Errors" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |error:|FAILED|FAILURE:" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Last 100 Log Lines" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 -c "
          with open('build.log', errors='ignore') as f:
              lines = f.readlines()
          errs = [l.strip() for l in lines if any(k in l for k in ['e: ', 'error:', 'AAPT:'])]
          if not errs:
              errs = [l.strip() for l in lines[-30:] if l.strip()]
          for l in errs[:15]:
              l_clean = l.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=CompilerError::{l_clean}')
          "

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shario-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: Shario-All-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "Shario v1.4.0 — Fast Sharing. Zero Hassle."
          make_latest: true
          body: |
            ### 🚀 Shario v1.4.0 — Fast Sharing. Zero Hassle.
            
            100% Bit-for-Bit Original Phone-to-Phone File Sharing (Ad-Free & Lossless).
            
            #### 📥 Direct APK Download (Latest)
            - **[⬇️ Download Shario.apk](https://github.com/abdulraheemasangi/shario/releases/download/v1.4.0/Shario.apk)** (Production Signed)
            
            #### What's New in v1.4.0:
            - **Fixed "App Not Installed" Failure**: Added fixed cryptographic release keystore and relaxed strict hardware feature requirements so APK updates and installs smoothly on every Android phone.
            - **Triple-Engine Device Scanning**: Built multi-tiered discovery combining UDP broadcast beacons (`255.255.255.255:8989`), local network mDNS/NSD, and Wi-Fi Direct P2P so nearby phones are discovered in real time.
            - **Receiver Live Advertising**: Receiver now actively broadcasts presence across Wi-Fi Direct and local network while listening on sockets.
            - **Connectivity Diagnostics & System Actions**: Automatic checks for Wi-Fi toggle and Location services (Android 10-12 P2P requirement) with 1-tap enable buttons.
            - **100% Zero-Loss Binary Streaming**: Unmodified MediaStore streams with `setRequireOriginal` preserving GPS EXIF and SHA-256 verification.
          files: |
            app/build/outputs/apk/release/Shario.apk
            app/build/outputs/apk/debug/Shario-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
