name: Build Shario APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shario-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: Shario-All-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Shario v1.0.0 — Fast Sharing. Zero Hassle."
          make_latest: true
          body: |
            ### 🚀 Shario v1.0.0 — Fast Sharing. Zero Hassle.
            
            100% Bit-for-Bit Original Phone-to-Phone File Sharing (Ad-Free & Lossless).
            
            #### 📥 Direct APK Download
            - **[app-release.apk](https://github.com/abdulraheemasangi/shario/releases/download/v1.0.0/app-release.apk)**
            
            #### Features:
            - **Zero Quality Loss**: Photos, 4K videos, audio, and documents transferred without re-encoding or EXIF/GPS redaction.
            - **SHA-256 Verified**: Cryptographic integrity validation with "Verified ✓" badge.
            - **Fast Offline Transfers**: Wi-Fi Direct & Local Hotspot high-speed streaming.
            - **Split APKs**: Complete App Bundle extraction and atomic installation.
            - **E2E Encryption**: AES-256-GCM cipher with QR code key exchange.
          files: app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
